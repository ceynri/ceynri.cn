name: Deploy to Tencent COS

# 并发控制：同一时间只允许一个部署任务运行
concurrency:
  group: tencent-cos-deployment
  cancel-in-progress: true

# 触发条件
on:
  push:
    branches:
      - main
      - deploy
  repository_dispatch:
    types: [submodule-update]
  workflow_dispatch:

env:
  # 使用项目要求的 Node.js 版本
  NODE_VERSION: '24'
  PNPM_VERSION: '11'
  # 添加环境变量控制可选功能
  ENABLE_SUBMODULE_UPDATE: ${{ vars.ENABLE_SUBMODULE_UPDATE || 'false' }}
  ENABLE_TYPE_CHECK: ${{ vars.ENABLE_TYPE_CHECK || 'true' }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: production
    # 闸 A：跳过回写 commit 自触发的部署（仅 push 事件有 head_commit）
    if: >-
      ${{ github.event_name != 'push' ||
          !contains(github.event.head_commit.message, '[skip deploy]') }}

    steps:
      # 1. 检出代码
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}
          submodules: true
          fetch-depth: 0

      # 2. 更新子模块（如果需要）
      - name: Update submodules
        if: env.ENABLE_SUBMODULE_UPDATE == 'true'
        run: |
          git submodule update --remote
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain)" ]; then
            git commit -am "docs: update content"
            git push
          fi

      # 2.5 回写首次发布文章的 publishedAt
      # 检出与子模块就绪之后、构建之前执行，确保当次部署即包含新时间戳。
      # 回写 commit 以 [skip deploy] 开头，配合 job 级 if 守卫短路自触发部署环。
      # 注意：actions/checkout 把子模块检出为游离 HEAD，需先切回 main 分支；
      # 且先 rebase 对齐远端再生成时间戳，规避并发/重复触发导致的 non-fast-forward 与 stash 冲突。
      - name: Backfill publishedAt for first-published posts
        env:
          TZ: 'Asia/Shanghai'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          # 子模块处于游离 HEAD，先检出 main 并同步到远端最新（此时工作区干净）
          git -C content checkout main
          git -C content pull --rebase origin main
          # 脚本零依赖，直接用 runner 自带 node 运行（setup-node 之前即可），基于最新基线生成时间戳
          node scripts/backfill-published-at.mjs --base ./content
          # 若内容子模块有改动，则提交并推送（GH_PAT 认证）
          if [ -n "$(git -C content status --porcelain)" ]; then
            git -C content add -A
            git -C content commit -m "[skip deploy] chore: backfill publishedAt for first-published posts"
            git -C content push origin main
            echo "✅ 已回写 publishedAt 并推送 content 仓库"
          else
            echo "ℹ️ 无需回写"
          fi

      # 3. 设置 Node.js 环境
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          check-latest: true

      # 4. 设置 pnpm
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      # 5. 获取 pnpm store 目录
      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      # 6. 缓存 pnpm store
      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      # 7. 缓存 Astro 构建产物
      - name: Cache Astro build
        uses: actions/cache@v4
        with:
          path: |
            .astro
            node_modules/.astro
          key: ${{ runner.os }}-astro-${{ hashFiles('**/astro.config.*') }}-${{ hashFiles('src/**/*') }}
          restore-keys: |
            ${{ runner.os }}-astro-${{ hashFiles('**/astro.config.*') }}-
            ${{ runner.os }}-astro-

      # 8. 安装依赖
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      # 9. 运行类型检查和代码质量检查
      - name: Type check and lint
        if: env.ENABLE_TYPE_CHECK == 'true'
        run: |
          pnpm exec astro check
          pnpm exec biome ci ./src ./astro.config.ts

      # 10. 构建项目
      - name: Build project
        run: pnpm build

      # 11. 验证构建产物
      - name: Verify build output
        run: |
          if [ ! -d "dist" ]; then
            echo "❌ Build output directory 'dist' not found"
            exit 1
          fi
          if [ ! -f "dist/index.html" ]; then
            echo "❌ index.html not found in build output"
            exit 1
          fi
          echo "✅ Build verification passed"
          echo "📊 Build output size: $(du -sh dist)"

      # 12. 部署到腾讯云 COS 并刷新 CDN
      # 使用 fork 正式版 v1.6.0：在官方 v1.5.2 基础上新增 cdn_purge_index_as_dir 与
      # cdn_purge_strategy/cdn_flush_type（目录级刷新），已向上游提交 issue/PR，
      # 待上游采纳后可切回官方 tag
      # https://github.com/sylingd/tencent-cos-and-cdn-action
      - name: Deploy to Tencent COS and refresh CDN
        uses: ceynri/tencent-cos-and-cdn-action@v1.6.0
        with:
          # 腾讯云 API 密钥 ID
          secret_id: ${{ secrets.TENCENT_SECRET_ID }}
          # 腾讯云 API 密钥 Key
          secret_key: ${{ secrets.TENCENT_SECRET_KEY }}
          # COS 存储桶名称 (eg: my-website-1234567890)
          cos_bucket: ${{ secrets.TENCENT_COS_BUCKET }}
          # COS 存储桶区域 (eg: ap-shanghai)
          cos_region: ${{ secrets.TENCENT_COS_REGION }}
          # 指定 COS 存储类型为多 AZ 标准类型
          cos_put_options: '{"StorageClass":"MAZ_STANDARD"}'
          # 设置文件上传的并行任务数量
          cos_init_options: '{"FileParallelLimit":8}'
          # 是否替换同名文件
          cos_replace_file: crc64ecma
          # 检查重复文件的并行任务数量
          cos_file_check_concurrent: 32
          # 使用 COS 的加速域名进行上传
          cos_accelerate: true
          # CDN 域名前缀 (eg: https://cdn.example.com/)
          cdn_prefix: ${{ secrets.TENCENT_CDN_PREFIX }}
          # 等待 CDN 刷新完成再结束 step
          cdn_wait_flush: true
          # CDN 刷新策略：path=强制目录刷新（PurgePathCache），不依赖增量 diff，可根治缓存漂移
          cdn_purge_strategy: path
          # flush=回源比对 Last-Modify、仅变更资源重拉取，回源压力小于 delete
          cdn_flush_type: flush
          # 项目文件本地路径
          local_path: dist
          # COS 桶上传路径
          remote_path: /
          # 上传完后清理 remote_path 中非本次上传的文件
          # clean: true

      # 13. 部署结果
      - name: Deployment result summary
        run: |
          echo "✅ Deployment successful! Website has been updated to Tencent COS, CDN cache has been refreshed."
          echo "🎉 Build output size: $(du -sh dist | cut -f1)"
          echo "📅 Deployment time: $(date)"

  # 部署后的健康检查
  health-check:
    needs: build-and-deploy
    runs-on: ubuntu-latest
    if: success()

    steps:
      - name: Health check
        run: |
          if [ -n "${{ secrets.TENCENT_CDN_PREFIX }}" ]; then
            echo "🔍 Checking deployment status..."
            
            # 等待 CDN 刷新完成
            sleep 30
            
            # 检查网站是否可访问
            HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "${{ secrets.TENCENT_CDN_PREFIX }}" || echo "000")
            
            if [ "$HTTP_STATUS" = "200" ]; then
              echo "✅ Website health check passed (HTTP $HTTP_STATUS)"
            else
              echo "⚠️ Website health check failed (HTTP $HTTP_STATUS)"
              echo "This might be due to CDN cache not being refreshed yet, please try again later"
              exit 1
            fi
          else
            echo "ℹ️ Skipping health check: CDN domain not configured"
          fi
